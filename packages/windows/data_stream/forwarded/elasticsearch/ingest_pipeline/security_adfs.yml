---
# Keep this pipeline byte-identical in:
# - packages/system/data_stream/security/elasticsearch/ingest_pipeline/adfs.yml
# - packages/windows/data_stream/forwarded/elasticsearch/ingest_pipeline/security_adfs.yml
description: Normalize AD FS audit XML decoded by Elastic Agent.
processors:
  - set:
      tag: adfs_xml_activity_id
      field: winlog.adfs.activity_id
      copy_from: winlog.event_data.param1
      ignore_empty_value: true
      override: false
      if: "!['-', 'N/A'].contains(ctx.winlog?.event_data?.param1)"
  - script:
      tag: normalize_adfs_security_audit
      description: Flatten heterogeneous decoded XML components (object or array, string or #text).
      lang: painless
      if: 'ctx.winlog?._tmp?.adfs?.audit_base?.auditbase instanceof Map'
      source: |-
        Map asMap(def value) {
          return value instanceof Map ? value : null;
        }

        String text(def value) {
          if (value instanceof Map) {
            value = value.get('#text');
          }
          if (value == null) {
            return null;
          }
          String result = value.toString().trim();
          if (result.length() == 0 || result.equals('-') || result.equalsIgnoreCase('N/A')) {
            return null;
          }
          return result;
        }

        void copy(Map from, String name, Map to, String target) {
          if (from != null) {
            String value = text(from.get(name));
            if (value != null && !to.containsKey(target)) {
              to.put(target, value);
            }
          }
        }

        Map eventData = asMap(ctx.winlog.event_data);
        if (eventData == null) {
          return;
        }
        Map adfs = asMap(ctx.winlog.adfs);
        if (adfs == null) {
          adfs = new HashMap();
          ctx.winlog.put('adfs', adfs);
        }
        Map decoded = asMap(ctx.winlog._tmp?.adfs?.audit_base);
        Map audit = decoded == null ? null : asMap(decoded.get('auditbase'));
        if (audit != null) {
          copy(audit, 'audittype', adfs, 'audit_type');
          copy(audit, 'auditresult', adfs, 'audit_result');
          copy(audit, 'failuretype', adfs, 'failure_type');
          copy(audit, 'errorcode', adfs, 'error_code');
          copy(audit, 'userid', adfs, 'user_id');
          copy(audit, 'ipaddress', adfs, 'ip_address');
          copy(audit, 'currentbadpasswordcount', adfs, 'current_bad_password_count_raw');

          Map components = asMap(audit.get('contextcomponents'));
          def children = components == null ? null : components.get('component');
          ArrayList items = new ArrayList();
          if (children instanceof List) {
            items.addAll(children);
          } else if (children != null) {
            items.add(children);
          }
          for (def item : items) {
            Map component = asMap(item);
            if (component == null) {
              continue;
            }
            copy(component, 'userid', adfs, 'user_id');
            copy(component, 'relyingparty', adfs, 'relying_party');
            copy(component, 'claimsprovider', adfs, 'claims_provider');
            copy(component, 'primaryauth', adfs, 'primary_auth');
            copy(component, 'mfamethod', adfs, 'mfa_method');
            copy(component, 'authprotocol', adfs, 'auth_protocol');
            copy(component, 'oauthclientid', adfs, 'oauth_client_id');
            copy(component, 'oauthgrant', adfs, 'oauth_grant');
            copy(component, 'networklocation', adfs, 'network_location');
            copy(component, 'endpoint', adfs, 'endpoint');
            copy(component, 'useragentstring', adfs, 'user_agent');
            copy(component, 'ipaddress', adfs, 'ip_address');
            copy(component, 'currentbadpasswordcount', adfs, 'current_bad_password_count_raw');
            copy(component, 'mfaperformed', adfs, 'mfa_performed_raw');
          }
        }
        if (adfs.isEmpty()) {
          ctx.winlog.remove('adfs');
        }
  - lowercase:
      tag: adfs_xml_outcome
      field: winlog.adfs.audit_result
      target_field: event.outcome
      ignore_missing: true
      if: >-
        ctx.event?.outcome == null && ctx.winlog?.adfs?.audit_result instanceof String &&
        ['success', 'failure'].contains(ctx.winlog.adfs.audit_result.toLowerCase())
  - set:
      tag: adfs_xml_user_sid
      field: user.id
      copy_from: winlog.adfs.user_id
      override: false
      if: "ctx.winlog?.adfs?.user_id instanceof String && ctx.winlog.adfs.user_id.startsWith('S-1-')"
  - dissect:
      tag: adfs_xml_downlevel_account
      field: winlog.adfs.user_id
      pattern: '%{user.domain}\%{user.name}'
      ignore_missing: true
      ignore_failure: true
      if: >-
        ctx.user?.name == null && ctx.winlog?.adfs?.user_id instanceof String &&
        ctx.winlog.adfs.user_id.indexOf('\\') > 0 &&
        ctx.winlog.adfs.user_id.indexOf('\\') < ctx.winlog.adfs.user_id.length() - 1
  - dissect:
      tag: adfs_xml_upn_account
      field: winlog.adfs.user_id
      pattern: '%{user.name}@%{user.domain}'
      ignore_missing: true
      ignore_failure: true
      if: >-
        ctx.user?.name == null && ctx.winlog?.adfs?.user_id instanceof String &&
        !ctx.winlog.adfs.user_id.contains('\\') &&
        ctx.winlog.adfs.user_id.lastIndexOf('@') > 0 &&
        ctx.winlog.adfs.user_id.lastIndexOf('@') < ctx.winlog.adfs.user_id.length() - 1
  - set:
      tag: adfs_xml_unqualified_account
      field: user.name
      copy_from: winlog.adfs.user_id
      ignore_empty_value: true
      override: false
      if: >-
        ctx.winlog?.adfs?.user_id instanceof String &&
        !ctx.winlog.adfs.user_id.startsWith('S-1-')
  - append:
      tag: adfs_xml_related_name
      field: related.user
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: >-
        ctx.user?.name != null && ctx.winlog?.adfs?.user_id instanceof String &&
        !ctx.winlog.adfs.user_id.startsWith('S-1-')
  - append:
      tag: adfs_xml_related_original_identity
      field: related.user
      value: '{{{winlog.adfs.user_id}}}'
      allow_duplicates: false
      if: >-
        ctx.user?.name != null && ctx.winlog?.adfs?.user_id instanceof String &&
        !ctx.winlog.adfs.user_id.startsWith('S-1-')
  - gsub:
      field: winlog.adfs.mfa_performed_raw
      pattern: '^1$'
      replacement: 'true'
      ignore_missing: true
  - gsub:
      field: winlog.adfs.mfa_performed_raw
      pattern: '^0$'
      replacement: 'false'
      ignore_missing: true
  - convert:
      tag: adfs_xml_mfa_performed
      field: winlog.adfs.mfa_performed_raw
      target_field: winlog.adfs.mfa_performed
      type: boolean
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.adfs.mfa_performed_raw
            ignore_missing: true
  - remove:
      field: winlog.adfs.mfa_performed_raw
      ignore_missing: true
  - convert:
      tag: adfs_xml_bad_password_count
      field: winlog.adfs.current_bad_password_count_raw
      target_field: winlog.adfs.current_bad_password_count
      type: long
      ignore_missing: true
      on_failure:
        - remove:
            field: winlog.adfs.current_bad_password_count_raw
            ignore_missing: true
  - remove:
      field: winlog.adfs.current_bad_password_count_raw
      ignore_missing: true
  - split:
      tag: adfs_xml_address_hops
      field: winlog.adfs.ip_address
      target_field: winlog._tmp.adfs.ip_candidates
      separator: ','
      preserve_trailing: true
      ignore_missing: true
  - foreach:
      tag: adfs_xml_proxy_observed_address
      field: winlog._tmp.adfs.ip_candidates
      ignore_missing: true
      if: 'ctx.source?.ip == null'
      processor:
        set:
          field: source.ip
          copy_from: _ingest._value
  - trim:
      field: source.ip
      ignore_missing: true
      if: 'ctx.winlog?._tmp?.adfs?.ip_candidates != null'
  - remove:
      field: winlog._tmp.adfs.ip_candidates
      ignore_missing: true
  - set:
      field: event.action
      value: adfs-token-issued
      if: "ctx.event?.code == '1200'"
  - set:
      field: event.action
      value: adfs-token-issuance-failed
      if: "ctx.event?.code == '1201'"
  - set:
      field: event.action
      value: adfs-authentication-success
      if: "ctx.event?.code == '1202'"
  - set:
      field: event.action
      value: adfs-authentication-failed
      if: "ctx.event?.code == '1203'"
  - set:
      field: event.action
      value: adfs-password-change-success
      if: "ctx.event?.code == '1204'"
  - set:
      field: event.action
      value: adfs-password-change-failed
      if: "ctx.event?.code == '1205'"
  - set:
      field: event.action
      value: adfs-sign-out-success
      if: "ctx.event?.code == '1206'"
  - set:
      field: event.action
      value: adfs-sign-out-failed
      if: "ctx.event?.code == '1207'"
  - set:
      field: event.action
      value: adfs-extranet-lockout
      if: "ctx.event?.code == '1210'"
  - set:
      field: event.category
      value: [iam]
      if: "['1204', '1205'].contains(ctx.event?.code)"
  - set:
      field: event.category
      value: [authentication]
      if: "['1200', '1201', '1202', '1203', '1206', '1207', '1210'].contains(ctx.event?.code)"
  - set:
      field: event.type
      value: [change]
      if: "['1204', '1205'].contains(ctx.event?.code)"
  - set:
      field: event.type
      value: [end]
      if: "['1206', '1207'].contains(ctx.event?.code)"
  - set:
      field: event.type
      value: [start]
      if: "['1200', '1201', '1202', '1203'].contains(ctx.event?.code)"
  - set:
      field: event.type
      value: [info]
      if: "ctx.event?.code == '1210'"
  - set:
      field: event.kind
      value: event
      override: false
      if: "['1200', '1201', '1202', '1203', '1204', '1205', '1206', '1207', '1210'].contains(ctx.event?.code)"
  - convert:
      tag: validate_adfs_source_ip
      field: source.ip
      type: ip
      ignore_missing: true
      # An invalid client-supplied address is recoverable; keep the raw XML and
      # winlog.adfs.ip_address instead of marking the entire audit as an error.
      on_failure:
        - remove:
            tag: discard_invalid_adfs_source_ip
            field: source.ip
            ignore_missing: true
on_failure:
  - append:
      tag: report_adfs_audit_normalization_failure
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}' with tag
        '{{{ _ingest.on_failure_processor_tag }}}' in pipeline
        '{{{ _ingest.on_failure_pipeline }}}' failed with message
        '{{{ _ingest.on_failure_message }}}'
  - set:
      tag: mark_adfs_audit_pipeline_error
      field: event.kind
      value: pipeline_error
  - append:
      tag: preserve_original_adfs_audit_on_error
      field: tags
      value: preserve_original_event
      allow_duplicates: false
